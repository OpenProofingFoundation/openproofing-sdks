      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: npm ci --ignore-scripts
      - run: python3 scripts/bootstrap.py
      - run: python3 scripts/check.py --sdk ${{ matrix.sdk }} --platform macos
      - name: Preserve scoped QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.sdk }}-macos-quality
          path: |-
            .build/validation/
            ${{ matrix.sdk }}/.build/quality/
          if-no-files-found: error
          retention-days: 7
  ios-device:
    name: ${{ matrix.sdk }} / ios-device
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - document
          - passport
          - biometric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
