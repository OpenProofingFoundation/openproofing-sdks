name: SDK quality
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: sdk-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  guards:
    name: ${{ matrix.sdk }} / guards
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - document
          - passport
          - biometric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: npm ci --ignore-scripts
      - run: python3 scripts/bootstrap.py
      - run: python3 scripts/check.py --sdk ${{ matrix.sdk }} --platform guards
      - name: Preserve scoped QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.sdk }}-guards-quality
          path: |-
            .build/validation/
            ${{ matrix.sdk }}/.build/quality/
          if-no-files-found: error
          retention-days: 7
  macos:
    name: ${{ matrix.sdk }} / macos
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - document
          - passport
          - biometric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
