  licence-check:
    name: licence-check / Node packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: python3 quality/licence_check_guards.py
      - run: npm ci --ignore-scripts
        working-directory: services/licence-check
      - run: python3 quality/licence_check_guards.py --execute
      - name: Preserve licence-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: licence-check-node
          path: |-
            .build/licence-check/
            services/licence-check/.build/consumer/
          if-no-files-found: error
          retention-days: 7
